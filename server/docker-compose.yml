version: '3.8'

services:
  # 1. Primary Database
  postgres:
    image: postgres:15-alpine
    container_name: typeahead_postgres
    environment:
      POSTGRES_USER: typeahead_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: typeahead_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typeahead_user -d typeahead_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Distributed Cache Cluster (3 Physical Nodes)
  redis1:
    image: redis:7-alpine
    container_name: typeahead_redis_1
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis2:
    image: redis:7-alpine
    container_name: typeahead_redis_2
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis3:
    image: redis:7-alpine
    container_name: typeahead_redis_3
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Java Spring Boot Backend
  app:
    build: .
    container_name: typeahead_server
    ports:
      - "8080:8080"
    environment:
      # Connect to the local Postgres container
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/typeahead_db
      - SPRING_DATASOURCE_USERNAME=typeahead_user
      - SPRING_DATASOURCE_PASSWORD=password
      
      # Connect to the 3 local Redis containers
      # Note: Inside the Docker network, they all listen on their internal port 6379
      - APP_REDIS_NODE1_HOST=redis1
      - APP_REDIS_NODE1_PORT=6379
      - APP_REDIS_NODE2_HOST=redis2
      - APP_REDIS_NODE2_PORT=6379
      - APP_REDIS_NODE3_HOST=redis3
      - APP_REDIS_NODE3_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis1:
        condition: service_healthy
      redis2:
        condition: service_healthy
      redis3:
        condition: service_healthy